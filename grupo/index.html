<script>
  var CODE = 'E9EsCG4IZPO0SFuUdMrewg';
  var GRUPO = 'https://chat.whatsapp.com/' + CODE;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  // Abre o app do WhatsApp direto (sem a página "Abrir app / WhatsApp Web")
  function appLink(){
    if (isAndroid) return 'intent://chat.whatsapp.com/' + CODE +
      '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(GRUPO) + ';end';
    if (isIOS) return 'whatsapp://chat?code=' + CODE;
    return GRUPO;
  }

  function abrir(){
    var link = appLink();
    location.href = link;
    // Reserva: se o app não abriu (navegador bloqueou), cai no link normal do convite
    if (link !== GRUPO) setTimeout(function(){ if (!document.hidden) location.replace(GRUPO); }, 1500);
  }

  setTimeout(abrir, 400); // tempo pro pixel enviar o evento
</script>
