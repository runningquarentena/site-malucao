<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0f0c;--card:#111814;--line:#1f2a23;--txt:#f4f7f5;--mut:#93a39a;--g:#22c55e;--g2:#16a34a;--y:#facc15}
  body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt);min-height:100vh;
       background:radial-gradient(120% 60% at 50% -10%,rgba(34,197,94,.18),transparent 60%),var(--bg)}
  main{max-width:380px;margin:0 auto;padding:36px 20px 28px;text-align:center}

  /* logo com anel girando */
  .ring{position:relative;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;padding:3px}
  .ring::before{content:"";position:absolute;inset:0;border-radius:50%;
       background:conic-gradient(from 0deg,var(--g),var(--y),var(--g2),var(--g));animation:spin 4s linear infinite}
  .ring img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--bg)}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{font-size:22px;font-weight:700;letter-spacing:-.2px}
  .status{display:inline-flex;align-items:center;gap:7px;margin:8px 0 22px;font-size:14px;color:var(--mut)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 1.6s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 10px rgba(34,197,94,0)}}

  /* botão com brilho passando */
  .btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
       background:linear-gradient(180deg,#25d366,#18a84f);color:#fff;font-weight:700;font-size:18px;
       padding:18px;border-radius:14px;text-decoration:none;box-shadow:0 8px 24px rgba(34,197,94,.25)}
  .btn svg{width:24px;height:24px;flex:none}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
       background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);
       animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
  .btn:active{transform:scale(.985)}
  .btn.loading{pointer-events:none}
  .alt{display:inline-block;margin-top:14px;font-size:13px;color:var(--mut)}
  .prog{height:4px;background:#1f2a23;border-radius:99px;overflow:hidden;margin-top:14px}
  .prog i{display:block;height:100%;width:0;background:var(--g);transition:width linear}
  .hint{font-size:14px;color:var(--mut);margin-top:10px}

  /* prévia do grupo: mensagens chegando */
  .chat{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;overflow:hidden}
  .chat-top{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .chat-top img{width:30px;height:30px;border-radius:50%}
  .chat-top b{font-size:14px;display:block}
  .chat-top small{font-size:12px;color:var(--mut)}
  .msgs{display:flex;flex-direction:column;gap:8px;min-height:150px}
  .msg{max-width:88%;background:#1a2620;border-radius:4px 12px 12px 12px;padding:9px 11px;font-size:14px;line-height:1.35;
       opacity:0;transform:translateY(8px);animation:inMsg .45s ease forwards}
  .msg small{display:block;text-align:right;font-size:11px;color:var(--mut);margin-top:3px}
  .typing{display:inline-flex;gap:4px;background:#1a2620;border-radius:12px;padding:10px 12px;width:max-content}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes inMsg{to{opacity:1;transform:none}}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.msg{opacity:1;transform:none}}

<script>
  // mensagens de exemplo chegando em loop (sem preços inventados)
  (function(){
    var M=['🔥 Oferta relâmpago na Amazon','🎟️ Cupom novo liberado no Mercado Livre','⚡ Achado do dia na Shopee','💥 Preço caiu: corre que acaba rápido'];
    var box=document.getElementById('msgs'), i=0;
    function hora(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
    function next(){
      var t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';box.appendChild(t);
      setTimeout(function(){
        t.remove();
        var m=document.createElement('div');m.className='msg';m.innerHTML=M[i%M.length]+'<small>'+hora()+'</small>';
        box.appendChild(m); i++;
        while(box.children.length>3) box.removeChild(box.firstChild);
        setTimeout(next,1600);
      },900);
    }
    setTimeout(next,500);
  })();
</script>
<script>
  var CODE = 'CkVDywsehHJJuAOdHtimdu';
  var WEB  = 'https://chat.whatsapp.com/' + CODE;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var btn = document.getElementById('entrar');

  // Android: abre o app direto (com reserva embutida pro link normal)
  var ANDROID = 'intent://chat.whatsapp.com/' + CODE +
    '#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=' + encodeURIComponent(WEB) + ';end';

  // iPhone: o toque no link normal abre o app direto (sem a caixinha "Abrir com WhatsApp?")
  btn.href = isAndroid ? ANDROID : WEB;

  // Redirecionamento automático: rápido no Android/PC, mais tempo no iPhone pra pessoa tocar no botão
  var espera = isIOS ? 3500 : 1200;
  var bar = document.getElementById('bar');
  requestAnimationFrame(function(){ bar.style.transitionDuration = espera + 'ms'; bar.style.width = '100%'; });
  if (isIOS) document.getElementById('hint').textContent = 'Toque no botão verde para entrar.';

  var foi = false;
  btn.addEventListener('click', function(){ foi = true; });
  setTimeout(function(){
    if (foi || document.hidden) return;
    location.href = isAndroid ? ANDROID : WEB;
  }, espera);
</script>
